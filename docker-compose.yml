version: "3.9"

services:
  backend:
    build: ./backend
    container_name: traffic_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://admin:admin123@postgres:5432/traffic_db
      - REDIS_URL=redis://redis:6379
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}        # gemini | claude | openai
      - GEMINI_API_KEY=${GEMINI_API_KEY:-your_key_here}
      - CLAUDE_API_KEY=${CLAUDE_API_KEY:-your_key_here}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-your_key_here}
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads
      - ./snapshots:/app/snapshots
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: traffic_frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
      - REACT_APP_WS_URL=ws://localhost:8000
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - backend
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: traffic_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: traffic_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: traffic_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data:
